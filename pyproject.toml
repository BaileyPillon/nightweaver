[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rookline-windows"
version = "0.1.0"
description = "Windows-native orchestration for checked, resumable coding-agent runs"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = []

[project.scripts]
rookline = "rookline.cli:main"

[tool.setuptools.packages.find]
include = ["rookline*"]

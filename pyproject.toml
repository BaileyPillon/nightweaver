[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nightweaver-windows"
version = "0.16.0"
description = "Windows-native orchestration for checked, resumable coding-agent runs"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.49,<2", "Pillow>=10"]

[project.scripts]
nightweaver = "nightweaver.cli:main"
rookline = "nightweaver.cli:main"

[tool.setuptools.packages.find]
include = ["nightweaver*", "rookline*"]
